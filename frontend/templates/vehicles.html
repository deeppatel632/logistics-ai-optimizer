{% extends "base.html" %}
{% block title %}Vehicle Tracking{% endblock %}
{% block page_title %}🚛 Real-time Vehicle Tracking{% endblock %}

{% block head_extra %}
<!-- Leaflet.js CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #map { height: calc(100vh - 14rem); border-radius: 0.75rem; }
</style>
{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-4 h-full">

  <!-- Vehicle list sidebar -->
  <div class="lg:col-span-1 bg-gray-900 border border-gray-800 rounded-xl p-4 overflow-y-auto max-h-[calc(100vh-14rem)]">
    <h2 class="text-sm font-semibold text-gray-300 mb-3">Active Vehicles</h2>
    <div id="vehicle-list" class="space-y-2 text-xs text-gray-400">
      <p>Loading…</p>
    </div>

    <!-- Quick GPS publish form -->
    <div class="mt-6 border-t border-gray-800 pt-4">
      <h3 class="text-xs font-semibold text-gray-400 mb-3 uppercase tracking-wider">Publish Location</h3>
      <input id="pub-vehicle-id" type="number" placeholder="Vehicle ID"
             class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-100 mb-2
                    focus:outline-none focus:ring-1 focus:ring-blue-500" />
      <input id="pub-lat" type="number" step="0.0001" placeholder="Latitude"
             class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-100 mb-2
                    focus:outline-none focus:ring-1 focus:ring-blue-500" />
      <input id="pub-lon" type="number" step="0.0001" placeholder="Longitude"
             class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-100 mb-2
                    focus:outline-none focus:ring-1 focus:ring-blue-500" />
      <button onclick="publishLocation()"
              class="w-full bg-blue-700 hover:bg-blue-600 text-white text-xs rounded py-1.5 transition">
        📡 Publish
      </button>
      <p id="pub-status" class="text-xs text-gray-500 mt-2"></p>
    </div>
  </div>

  <!-- Map -->
  <div class="lg:col-span-3">
    <div id="map"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Leaflet.js -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Map init ─────────────────────────────────────────────────────────
const map = L.map('map').setView([51.505, -0.09], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

const vehicleMarkers = {};
const statusColors = {
  Available: '#22c55e',
  InTransit: '#3b82f6',
  Unavailable: '#ef4444',
};

function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:14px; height:14px; border-radius:50%;
      background:${color}; border:2px solid #fff;
      box-shadow:0 0 6px ${color}66;
    "></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
}

function updateMap(vehicles) {
  if (!Array.isArray(vehicles)) return;

  vehicles.forEach(v => {
    const lat = v.current_latitude;
    const lon = v.current_longitude;
    if (!lat || !lon) return;

    const color = statusColors[v.status] || '#94a3b8';
    const popup = `
      <div style="font-size:12px; color:#1e293b;">
        <strong>Vehicle #${v.id}</strong><br/>
        Type: ${v.type}<br/>
        Status: <span style="color:${color}">${v.status}</span><br/>
        📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}
      </div>`;

    if (vehicleMarkers[v.id]) {
      vehicleMarkers[v.id].setLatLng([lat, lon])
        .setIcon(makeIcon(color))
        .setPopupContent(popup);
    } else {
      vehicleMarkers[v.id] = L.marker([lat, lon], { icon: makeIcon(color) })
        .bindPopup(popup)
        .addTo(map);
    }
  });

  // Sidebar list
  document.getElementById('vehicle-list').innerHTML = vehicles.map(v => `
    <div class="border border-gray-800 rounded-lg p-2.5 cursor-pointer hover:bg-gray-800 transition"
         onclick="map.setView([${v.current_latitude}, ${v.current_longitude}], 12)">
      <div class="flex items-center justify-between mb-1">
        <span class="font-semibold text-gray-200">🚛 #${v.id}</span>
        <span class="px-1.5 py-0.5 rounded text-xs"
              style="background:${statusColors[v.status] || '#475569'}22;
                     color:${statusColors[v.status] || '#94a3b8'}">
          ${v.status}
        </span>
      </div>
      <p class="text-gray-500">${v.type}</p>
      <p class="text-gray-600">${v.current_latitude?.toFixed(3)}, ${v.current_longitude?.toFixed(3)}</p>
    </div>
  `).join('') || '<p class="text-gray-500">No vehicles found.</p>';
}

async function refreshVehicles() {
  try {
    const r = await fetch('/api/vehicles');
    if (!r.ok) return;
    const data = await r.json();
    updateMap(Array.isArray(data) ? data : data.vehicles || []);
  } catch(e) {
    console.error('vehicle fetch failed', e);
  }
}

// Publish GPS update
async function publishLocation() {
  const vid = document.getElementById('pub-vehicle-id').value;
  const lat = parseFloat(document.getElementById('pub-lat').value);
  const lon = parseFloat(document.getElementById('pub-lon').value);
  const status = document.getElementById('pub-status');

  if (!vid || isNaN(lat) || isNaN(lon)) {
    status.textContent = '⚠ Fill all fields.';
    return;
  }

  try {
    const r = await fetch('/api/vehicles/location', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ vehicle_id: parseInt(vid), latitude: lat, longitude: lon }),
    });
    status.textContent = r.ok ? '✅ Published!' : `Error ${r.status}`;
  } catch(e) {
    status.textContent = '❌ Network error';
  }
  setTimeout(() => { status.textContent = ''; }, 3000);
}

// Auto-refresh every 5 seconds
refreshVehicles();
setInterval(refreshVehicles, 5_000);
</script>
{% endblock %}
