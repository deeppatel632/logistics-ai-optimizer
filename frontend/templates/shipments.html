{% extends "base.html" %}
{% block title %}Shipments{% endblock %}
{% block page_title %}Shipment Management{% endblock %}
{% block content %}

<div class="card" style="margin-bottom:18px;">
  <div class="card-header">
    <span class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Shipment
    </span>
  </div>
  <div class="card-body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:flex-end;">
      <div><label class="form-label">Warehouse ID</label><input id="f-wh" type="number" placeholder="1" class="form-input" /></div>
      <div><label class="form-label">Product ID</label><input id="f-prod" type="number" placeholder="1" class="form-input" /></div>
      <div><label class="form-label">Quantity</label><input id="f-qty" type="number" placeholder="100" class="form-input" /></div>
      <button onclick="createShipment()" class="btn btn-primary" style="white-space:nowrap;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create
      </button>
    </div>
    <p id="create-status" style="font-size:12px;color:#64748b;margin-top:8px;"></p>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <span class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      All Shipments
    </span>
    <div style="display:flex;gap:10px;align-items:center;">
      <select id="status-filter" onchange="applyFilter()" class="form-select" style="width:auto;padding:5px 32px 5px 10px;font-size:12px;">
        <option value="">All statuses</option>
        <option>Pending</option><option>InTransit</option><option>Delivered</option><option>Cancelled</option>
      </select>
      <button onclick="refreshShipments()" class="btn btn-secondary btn-sm">Refresh</button>
    </div>
  </div>
  <div style="overflow-x:auto;">
    <table class="tbl">
      <thead><tr><th>ID</th><th>Warehouse</th><th>Product</th><th>Vehicle</th><th>Qty</th><th>Status</th></tr></thead>
      <tbody id="shipment-table"><tr><td colspan="6" style="color:#94a3b8;">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
  <div style="padding:10px 16px;border-top:1px solid #f1f5f9;">
    <span id="shipment-count" style="font-size:12px;color:#94a3b8;"></span>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
let allShipments = [];
const badgeClass = { Pending:'badge-pending', InTransit:'badge-transit', Delivered:'badge-delivered', Cancelled:'badge-cancelled' };

function renderTable(rows) {
  const tbody = document.getElementById('shipment-table');
  document.getElementById('shipment-count').textContent = rows.length ? `${rows.length} shipment(s)` : '';
  if (!rows.length) { tbody.innerHTML='<tr><td colspan="6" style="color:#94a3b8;">No shipments match.</td></tr>'; return; }
  tbody.innerHTML = rows.map(s => `<tr>
    <td class="tbl-mono">#${s.id}</td><td>${s.warehouse_id}</td><td>${s.product_id}</td>
    <td>${s.vehicle_id??'<span style="color:#cbd5e1;">—</span>'}</td>
    <td style="font-weight:500;">${s.quantity}</td>
    <td><span class="badge ${badgeClass[s.status]||'badge-pending'}">${s.status}</span></td>
  </tr>`).join('');
}

function applyFilter() {
  const f = document.getElementById('status-filter').value;
  renderTable(f ? allShipments.filter(s=>s.status===f) : allShipments);
}

async function refreshShipments() {
  try { const r = await fetch('/api/shipments'); allShipments = await r.json(); if(!Array.isArray(allShipments)) allShipments=[]; applyFilter(); }
  catch(e) { document.getElementById('shipment-table').innerHTML='<tr><td colspan="6" style="color:#ef4444;">Failed to load.</td></tr>'; }
}

async function createShipment() {
  const btn=document.querySelector('[onclick="createShipment()"]'); const st=document.getElementById('create-status');
  const body={warehouse_id:+document.getElementById('f-wh').value,product_id:+document.getElementById('f-prod').value,quantity:+document.getElementById('f-qty').value};
  if(!body.warehouse_id||!body.product_id||!body.quantity){st.style.color='#ef4444';st.textContent='All fields required.';return;}
  btn.disabled=true;
  try {
    const r=await fetch('/api/shipments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){st.style.color='#10b981';st.textContent='Shipment created.';refreshShipments();}
    else{const d=await r.json();st.style.color='#ef4444';st.textContent=d.detail||'Error.';}
  } catch(e){st.style.color='#ef4444';st.textContent='Network error.';}
  btn.disabled=false;
}

refreshShipments();
setInterval(refreshShipments,20000);
</script>
{% endblock %}
