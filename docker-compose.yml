version: "3.9"

services:

  sql_edge:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: logistics_sql_edge
    environment:
      - ACCEPT_EULA=1
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

  redis:
    image: redis:7
    container_name: logistics_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  sql_data: