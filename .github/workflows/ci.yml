name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # All Settings fields required by pydantic-settings must be present so
    # that `from backend.xxx import ...` doesn't fail during collection.
    env:
      APP_ENV: test
      DEBUG: "false"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_SERVER: localhost
      DB_PORT: "1433"
      DB_NAME: test_db
      DB_DRIVER: "ODBC Driver 18 for SQL Server"
      PRIMARY_DB_URL: "mssql+pyodbc://test_user:test_pass@localhost:1433/test_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      REPLICA_DB_URL: "mssql+pyodbc://test_user:test_pass@localhost:1433/test_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"
      DB_POOL_TIMEOUT: "5"
      DB_POOL_RECYCLE: "300"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      JWT_SECRET: ci-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install testing tools
        run: |
          pip install pytest flake8

      - name: Lint code
        run: |
          flake8 backend --max-line-length=120

      - name: Run tests
        run: |
          pytest