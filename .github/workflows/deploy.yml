name: CD — Build, Push, Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight production deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/logistics-ai-optimizer
  K8S_NAMESPACE: logistics-ai

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. TEST — mirrors ci.yml exactly so there are no surprises
  # ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DEBUG: "true"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DB_USER: sa
      DB_PASSWORD: YourStrong!Passw0rd
      DB_SERVER: localhost
      DB_PORT: "1433"
      DB_NAME: logistics_db
      DB_DRIVER: "ODBC+Driver+18+for+SQL+Server"
      PRIMARY_DB_URL: "mssql+pyodbc://sa:YourStrong!Passw0rd@localhost:1433/logistics_db?driver=ODBC+Driver+18+for+SQL+Server"
      REPLICA_DB_URL: "mssql+pyodbc://sa:YourStrong!Passw0rd@localhost:1433/logistics_db?driver=ODBC+Driver+18+for+SQL+Server"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_TIMEOUT: "30"
      DB_POOL_RECYCLE: "1800"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      JWT_SECRET: test-jwt-secret-for-ci
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"
      KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
      TRITON_BASE_URL: "http://localhost:8001"
      MINIO_ENDPOINT: "localhost:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: logistics-ai-data
      MINIO_USE_SSL: "false"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 backend/ --max-line-length=120 --exclude=__pycache__,venv

      - name: Run tests
        run: pytest -v --tb=short

  # ────────────────────────────────────────────────────────────
  # 2. BUILD — multi-stage Docker image, push to GHCR
  # ────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.vars.outputs.short_sha }}

      - name: Generate SBOM (software bill of materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
          artifact-name: sbom-${{ steps.vars.outputs.short_sha }}.spdx

  # ────────────────────────────────────────────────────────────
  # 3. SECURITY SCAN — scan image before deploying
  # ────────────────────────────────────────────────────────────
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.short_sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"        # fail job if CRITICAL/HIGH CVEs found

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ────────────────────────────────────────────────────────────
  # 4. DEPLOY — rolling update on the Kubernetes cluster
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, scan]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://api.logistics-ai.example.com
    permissions:
      contents: read

    steps:
      - name: Checkout (for k8s manifests)
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.28.0"

      - name: Configure kubectl context
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: kubectl cluster-info --context=$(kubectl config current-context)

      - name: Update ConfigMap
        run: |
          kubectl apply -f k8s/configmap.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Rolling update — API deployment
        run: |
          kubectl set image deployment/logistics-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.short_sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Rolling update — Celery deployment
        run: |
          kubectl set image deployment/logistics-celery \
            celery-worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.short_sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/logistics-api \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Wait for Celery rollout
        run: |
          kubectl rollout status deployment/logistics-celery \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Run database migrations
        run: |
          kubectl exec deployment/logistics-api \
            -n ${{ env.K8S_NAMESPACE }} \
            -- alembic upgrade head

      - name: Smoke test — liveness probe
        run: |
          kubectl exec deployment/logistics-api \
            -n ${{ env.K8S_NAMESPACE }} \
            -- curl -sf http://localhost:8000/health/live

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."
          kubectl rollout undo deployment/logistics-api -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/logistics-celery -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/logistics-api -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          echo "Rollback complete."

      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Deployed `${{ github.repository }}` @ `sha-${{ needs.build.outputs.short_sha }}` to *${{ github.event.inputs.environment || 'production' }}*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Deployment successful*\nRepo: `${{ github.repository }}`\nSHA: `${{ github.sha }}`\nEnvironment: `${{ github.event.inputs.environment || 'production' }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true   # don't fail deploy if Slack notification fails
