# =============================================================================
# k8s/secrets.yaml
#
# Kubernetes Secret for sensitive credentials.
# Values are base64-encoded strings.
#
# ⚠  NEVER commit real secrets to version control.
#    Replace every placeholder below before applying.
#
# Generate base64 from a shell:
#   echo -n "YourActualPassword" | base64
#
# Recommended: manage this file with Sealed Secrets, External Secrets Operator,
# or HashiCorp Vault rather than a plain YAML file in your repository.
#
# Rotate secrets procedure:
#   1. Update values here (re-encode with base64)
#   2. kubectl apply -f k8s/secrets.yaml
#   3. kubectl rollout restart deployment/api-deployment -n logistics-ai
#   4. kubectl rollout restart deployment/celery-deployment -n logistics-ai
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: logistics-secrets
  namespace: logistics-ai
  labels:
    app.kubernetes.io/part-of: logistics-ai-optimizer
# `Opaque` is the generic secret type.  For TLS certificates use
# `kubernetes.io/tls`; for image pull credentials use
# `kubernetes.io/dockerconfigjson`.
type: Opaque
data:
  # ---------------------------------------------------------------------------
  # DB_PASSWORD
  # The SA password for Azure SQL Edge.
  # Must satisfy SQL Server password complexity:
  #   - ≥8 chars, uppercase, lowercase, digit, special char
  # Placeholder below decodes to: CHANGE_ME_Strong!Passw0rd
  # echo -n "CHANGE_ME_Strong!Passw0rd" | base64
  # ---------------------------------------------------------------------------
  DB_PASSWORD: "Q0hBTkdFX01FX1N0cm9uZyFQYXNzdzByZA=="   # ← REPLACE

  # ---------------------------------------------------------------------------
  # JWT_SECRET
  # HMAC signing key for access tokens.  Use a minimum 256-bit random string.
  # Generate: openssl rand -hex 32
  # Placeholder decodes to: CHANGE_ME_jwt_secret_replace_with_openssl_rand_hex_32
  # ---------------------------------------------------------------------------
  JWT_SECRET: "Q0hBTkdFX01FX2p3dF9zZWNyZXRfcmVwbGFjZV93aXRoX29wZW5zc2xfcmFuZF9oZXhfMzI="  # ← REPLACE
