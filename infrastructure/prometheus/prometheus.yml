global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: logistics-ai
    environment: production

# ── Alertmanager ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # targets: ["alertmanager:9093"]

# ── Recording/alerting rules ──────────────────────────────────────────────────
rule_files:
  - "rules/*.yml"

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  # FastAPI application
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          component: backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Celery workers — via celery-exporter sidecar
  - job_name: celery
    metrics_path: /metrics
    static_configs:
      - targets: ["celery_exporter:9808"]
        labels:
          service: celery
          component: worker

  # Flower — Celery monitoring UI exports basic metrics
  - job_name: celery_flower
    metrics_path: /metrics
    static_configs:
      - targets: ["celery_flower:5555"]
        labels:
          service: flower
          component: worker

  # Redis — via redis_exporter
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          service: redis
          component: cache

  # Apache Kafka — via kafka_exporter (JMX or kafka-exporter binary)
  - job_name: kafka
    static_configs:
      - targets: ["kafka_exporter:9308"]
        labels:
          service: kafka
          component: streaming

  # NVIDIA Triton Inference Server
  # Triton exposes Prometheus metrics on port 8002
  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]
        labels:
          service: triton
          component: ml-serving

  # MinIO object storage
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio
          component: storage
    # MinIO requires bearer token for metrics endpoint
    # authorization:
    #   credentials: <MINIO_PROMETHEUS_AUTH_TOKEN>

  # Azure SQL Edge — via mssql_exporter
  - job_name: mssql
    static_configs:
      - targets: ["mssql_exporter:4000"]
        labels:
          service: sql_edge
          component: database

  # OpenTelemetry Collector — internal metrics
  - job_name: otel_collector
    static_configs:
      - targets: ["otel_collector:8888"]
        labels:
          service: otel_collector
          component: observability

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          component: observability

  # Grafana
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
          component: observability

  # Kubernetes API server (if running in-cluster)
  # - job_name: kubernetes-apiservers
  #   kubernetes_sd_configs:
  #     - role: endpoints
  #   scheme: https
  #   tls_config:
  #     ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  #   bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  #   relabel_configs:
