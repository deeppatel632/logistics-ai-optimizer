# ---------------------------------------------------------------------------
# Production compose file.
# Requires: .env.prod (copy .env.prod.example and fill in real secrets).
# Run:  docker compose -f docker-compose.prod.yml up --build -d
# ---------------------------------------------------------------------------

networks:
  logistics_net:
    driver: bridge

volumes:
  sql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  minio_data:

services:

  # -------------------------------------------------------------------------
  # Azure SQL Edge
  # -------------------------------------------------------------------------
  sql_edge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: logistics_sql_edge_prod
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      # sqlcmd ships inside the Azure SQL Edge image at this path.
      # $$MSSQL_SA_PASSWORD expands to the container env var at runtime.
      test:
        - "CMD-SHELL"
        - >
          /opt/mssql-tools/bin/sqlcmd
          -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "SELECT 1" -b 2>/dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s   # SQL Edge needs ~40-60 s to initialise

  # -------------------------------------------------------------------------
  # Redis
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: logistics_redis_prod
    # Persistence (AOF) + sensible memory cap for a shared host
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # FastAPI application
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics_api_prod
    env_file:
      - .env.prod          # all 22 Settings fields — see .env.prod.example
    ports:
      - "8000:8000"
    depends_on:
      sql_edge:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # -------------------------------------------------------------------------
  # OpenTelemetry Collector
  # -------------------------------------------------------------------------
  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: logistics_otel_collector_prod
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC
      - "8889:8889"   # Prometheus scrape endpoint for OTEL metrics
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Prometheus
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: logistics_prometheus_prod
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Grafana
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: logistics_grafana_prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      - prometheus

  # -------------------------------------------------------------------------
  # Celery worker — general + optimisation + prediction queues
  #
  # Horizontally scalable: run multiple replicas by changing --concurrency
  # or by deploying this service with `docker compose up --scale celery_worker=4`.
  #
  # Queue breakdown:
  #   -Q celery,optimization,prediction,simulation  — consume all queues on
  #   this worker pool.  In production, split into specialised pools:
  #     optimisation workers:  -Q optimization -c $(nproc)
  #     ML prediction workers: -Q prediction   -c 1  (if GPU-bound)
  #     simulation workers:    -Q simulation   -c 2
  # -------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics_celery_worker_prod
    # Worker command:
    #   -A  app module path (must match Celery() name in celery_app.py)
    #   -Q  queues this worker consumes (comma-separated)
    #   -c  concurrency (number of child processes); default = nproc
    #   --loglevel  Celery log level
    command: >
      celery -A backend.workers.celery_app
      worker
      -Q celery,optimization,prediction,simulation
      --loglevel=info
      --concurrency=4
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
      sql_edge:
        condition: service_healthy
    networks:
      - logistics_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # -------------------------------------------------------------------------
  # Flower — Celery task monitoring dashboard
  # Access: http://localhost:5555
  #
  # Shows: live task queue depths, worker status, task history, retry counts.
  # Safe to remove in cost-constrained environments; workers function without it.
  # -------------------------------------------------------------------------
  celery_flower:
    image: mher/flower:2.0.1
    container_name: logistics_celery_flower_prod
    command: >
      celery
      --broker=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      flower
      --port=5555
      --url_prefix=flower
    env_file:
      - .env.prod
    ports:
      - "5555:5555"
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  # -------------------------------------------------------------------------
  # Kafka (KRaft mode — no ZooKeeper).
  #
  # Uses the official Apache Kafka image (apache/kafka) — Bitnami removed
  # their Docker Hub tags in 2025.  apache/kafka is maintained by the ASF
  # and is the recommended replacement.
  #
  # KRaft removes the ZooKeeper dependency present in Kafka 2.x clusters.
  # The broker and controller roles both run in this single container,
  # making it ideal for single-node development and CI.
  #
  # For production, replace with a 3-node cluster or a managed service
  # (Confluent Cloud, AWS MSK, Azure Event Hubs with Kafka API).
  #
  # Topics are created automatically on first publish
  # (KAFKA_AUTO_CREATE_TOPICS_ENABLE=true, the default).
  # Pre-create topics with specific partition counts via:
  #   docker exec logistics_kafka /opt/kafka/bin/kafka-topics.sh \
  #     --bootstrap-server localhost:9092 --create \
  #     --topic vehicle-location-topic --partitions 6 --replication-factor 1
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: logistics_kafka
    ports:
      - "9092:9092"     # PLAINTEXT broker — reachable from the host
    environment:
      # KRaft identity (apache/kafka uses KAFKA_* not KAFKA_CFG_*)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Stable cluster ID — must be exactly 22 URL-safe base64 chars.
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qg
      # Listeners
      # PLAINTEXT  — for other containers on logistics_net (kafka:9092)
      # CONTROLLER — internal KRaft controller port (not exposed)
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      # Retention — keep messages for 24 h in this dev cluster.
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_LOG_RETENTION_BYTES=536870912   # 512 MB per partition
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      # Attempt to list topics — succeeds once the broker is fully ready.
      test:
        - "CMD-SHELL"
        - >
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
          > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------------
  # MinIO — S3-compatible object store (Data Lake, Step 50)
  #
  # Used for:
  #   • Training dataset exports (training/ prefix)
  #   • Trained model artefacts  (models/ prefix)
  #   • Inference logs           (inference-logs/ prefix)
  #
  # Console UI: http://localhost:9001  (login: minioadmin / minioadmin)
  # S3 API:     http://localhost:9000  (used by boto3 in backend/storage/)
  #
  # In production, replace with a managed MinIO cluster or AWS S3.
  # Change MINIO_ROOT_USER / MINIO_ROOT_PASSWORD via .env.prod.
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: logistics_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3-compatible API (boto3 endpoint)
      - "9001:9001"   # MinIO web console
    volumes:
      - minio_data:/data
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # NVIDIA Triton Inference Server  (Model Serving, Step 49)
  #
  # Serves ONNX, TensorRT, TensorFlow, PyTorch, and scikit-learn models.
  # Models are loaded from the model repository directory:
  #   ./triton_models/  →  /models  (inside container)
  #
  # Directory structure (one sub-dir per model):
  #   triton_models/
  #   └── eta_model/
  #       ├── config.pbtxt          ← model metadata / IO spec
  #       └── 1/
  #           └── model.onnx        ← model artefact
  #
  # HTTP API:  http://triton:8000  (used by model_client.py)
  # gRPC API:  triton:8001
  # Metrics:   http://triton:8002/metrics  (Prometheus-compatible)
  #
  # GPU support: add `deploy.resources.reservations.devices` (see Docker docs).
  # CPU-only:    the default config below runs on CPU.
  # -------------------------------------------------------------------------
  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    container_name: logistics_triton
    command: tritonserver --model-repository=/models --log-verbose=1
    volumes:
      - ./triton_models:/models:ro
    ports:
      - "8001:8000"   # Triton HTTP (mapped to 8001 to avoid conflict with FastAPI)
      - "8002:8001"   # Triton gRPC
      - "8003:8002"   # Triton metrics
    networks:
      - logistics_net
    restart: unless-stopped
    environment:
      # Tell model_client.py where to find Triton inside the Docker network.
      TRITON_BASE_URL: "http://triton:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # Triton loads models on startup — can be slow