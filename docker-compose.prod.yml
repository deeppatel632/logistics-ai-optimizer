# ---------------------------------------------------------------------------
# Production compose file.
# Requires: .env.prod (copy .env.prod.example and fill in real secrets).
# Run:  docker compose -f docker-compose.prod.yml up --build -d
# ---------------------------------------------------------------------------

networks:
  logistics_net:
    driver: bridge

volumes:
  sql_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:

  # -------------------------------------------------------------------------
  # Azure SQL Edge
  # -------------------------------------------------------------------------
  sql_edge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: logistics_sql_edge_prod
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      # sqlcmd ships inside the Azure SQL Edge image at this path.
      # $$MSSQL_SA_PASSWORD expands to the container env var at runtime.
      test:
        - "CMD-SHELL"
        - >
          /opt/mssql-tools/bin/sqlcmd
          -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "SELECT 1" -b 2>/dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s   # SQL Edge needs ~40-60 s to initialise

  # -------------------------------------------------------------------------
  # Redis
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: logistics_redis_prod
    # Persistence (AOF) + sensible memory cap for a shared host
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # FastAPI application
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics_api_prod
    env_file:
      - .env.prod          # all 22 Settings fields — see .env.prod.example
    ports:
      - "8000:8000"
    depends_on:
      sql_edge:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # -------------------------------------------------------------------------
  # OpenTelemetry Collector
  # -------------------------------------------------------------------------
  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: logistics_otel_collector_prod
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC
      - "8889:8889"   # Prometheus scrape endpoint for OTEL metrics
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Prometheus
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: logistics_prometheus_prod
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Grafana
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: logistics_grafana_prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      - prometheus

  # -------------------------------------------------------------------------
  # Celery worker — general + optimisation + prediction queues
  #
  # Horizontally scalable: run multiple replicas by changing --concurrency
  # or by deploying this service with `docker compose up --scale celery_worker=4`.
  #
  # Queue breakdown:
  #   -Q celery,optimization,prediction,simulation  — consume all queues on
  #   this worker pool.  In production, split into specialised pools:
  #     optimisation workers:  -Q optimization -c $(nproc)
  #     ML prediction workers: -Q prediction   -c 1  (if GPU-bound)
  #     simulation workers:    -Q simulation   -c 2
  # -------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics_celery_worker_prod
    # Worker command:
    #   -A  app module path (must match Celery() name in celery_app.py)
    #   -Q  queues this worker consumes (comma-separated)
    #   -c  concurrency (number of child processes); default = nproc
    #   --loglevel  Celery log level
    command: >
      celery -A backend.workers.celery_app
      worker
      -Q celery,optimization,prediction,simulation
      --loglevel=info
      --concurrency=4
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
      sql_edge:
        condition: service_healthy
    networks:
      - logistics_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # -------------------------------------------------------------------------
  # Flower — Celery task monitoring dashboard
  # Access: http://localhost:5555
  #
  # Shows: live task queue depths, worker status, task history, retry counts.
  # Safe to remove in cost-constrained environments; workers function without it.
  # -------------------------------------------------------------------------
  celery_flower:
    image: mher/flower:2.0.1
    container_name: logistics_celery_flower_prod
    command: >
      celery
      --broker=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      flower
      --port=5555
      --url_prefix=flower
    env_file:
      - .env.prod
    ports:
      - "5555:5555"
    networks:
      - logistics_net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  # -------------------------------------------------------------------------
  # Kafka (KRaft mode — no ZooKeeper)
  # -------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:latest
    container_name: logistics_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - logistics_net
    restart: unless-stopped